# IQS compliance tracking for Huawei Router 5G Monitor
# Generated on 2026-05-06 v1.0.1
rules:
  # Bronze Tier
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver Tier
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold Tier
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: |
      SSDP discovery is technically possible - core huawei_lte matches Huawei
      InternetGatewayDevice - but it would only pre-fill the host. The router
      still requires credentials, so the user completes the same flow either
      way. Revisit if HA gains credential-less onboarding for these devices.
  discovery-update-info:
    status: exempt
    comment: |
      No discovery is implemented, so there is no discovery payload from which
      to refresh the host. The address is user-supplied and updated through the
      reconfigure flow.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: |
      The six sub-devices (System, Signal, Data, SMS, WiFi, Clients) are facets
      of one router, not separately removable hardware, so none can become
      stale. Connected clients are device_tracker ENTITIES on the Clients
      sub-device rather than devices - see the device_info override recorded in
      docs/ha_compatibility.md - and this rule is device-scoped.
      That override is the precondition for this exemption. Were it removed, HA
      2026.9+ would create a device per client and this rule would become live.
      Entity accumulation is handled by the cleanup_unused_entities action,
      which goes beyond what IQS requires.

  # Platinum Tier
  async-dependency: todo
  inject-websession: todo
  strict-typing: done
