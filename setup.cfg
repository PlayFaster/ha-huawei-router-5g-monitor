# SYNCED FILE — edit dev-workbench/workbench/python/setup.cfg and re-sync.
# The sync appends the project's .validate/mutmut_modules.txt to only_mutate.
# Background and traps: info/test_better_docs/mutation_testing_setup.md

[mutmut]
source_paths=custom_components

do_not_mutate_patterns=
    _LOGGER\.\w+

# Both lines needed: the first watches the tests, the second re-runs on a
# change. Without them a test-only change leaves stale verdicts cached.
cache_invalidation_files=
    tests/*.py

on_dependency_change=rerun

# `also_copy` is the only copy path that OVERWRITES. `copy_src_dir()` skips any
# file already present in mutants/ (`if target_path.exists(): continue`), so
# everything under source_paths is frozen at first-run content forever — while
# `copy_also_copy_files()` uses copy2/copytree(dirs_exist_ok=True) and refreshes
# on every run.
#
# Two consequences this list exists for:
#
#   scripts/   A project whose tests import from scripts/ fails to collect
#              inside mutants/ without it.
#
#   the component's non-Python artefacts — icons.json, strings.json,
#              translations/, services.yaml. Appended by the sync, because the
#              component directory name differs per project and `also_copy`
#              takes literal paths, not globs. Without them, an entity added
#              after mutants/ was created resolves in the source tree and not
#              in the copy, and the coverage tests fail INSIDE mutants/ only —
#              aborting the run at clean-test collection with a failure that
#              does not reproduce under plain pytest.
#
# Note `tests/` is NOT listed and must not be: mutmut puts it in the DEFAULT
# also_copy (configuration.py), so it is already overwritten every run. Copying
# it by hand is never necessary. Caveat: copytree overwrites but never prunes,
# so a test file deleted from tests/ lingers in mutants/tests/ and keeps being
# collected.
also_copy=
    scripts/
    custom_components/huawei_router_5g/icons.json
    custom_components/huawei_router_5g/strings.json
    custom_components/huawei_router_5g/services.yaml
    custom_components/huawei_router_5g/quality_scale.yaml
    custom_components/huawei_router_5g/translations

# Newline-separated and indented. A comma-separated list matches nothing.
only_mutate=
    */helpers.py
    */diagnostics.py
    */device_tracker.py
    */coordinator.py
    */sensor.py
