name: Release

"on":
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write # Required to upload the HACS zip as a release asset
    # Branch @main — update SHA after pushing .github changes v2.0.12
    uses: PlayFaster/.github/.github/workflows/release.yaml@3ba3afea4cef9eba7bed16034b7ee30a6bb5e83e
    with:
      component_name: huawei_router_5g
      tag: ${{ github.event.release.tag_name }}
