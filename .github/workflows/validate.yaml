name: Validate

"on":
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Daily at midnight

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Branch @main — update SHA after pushing .github changes v2.0.14
    uses: PlayFaster/.github/.github/workflows/validate.yaml@b12898ea9b0d954deaf2a099f6bb9fb1fd0bc041
    with:
      category: integration
      component_name: huawei_router_5g
      gist_id: b5cb47f2b37e140da07eefd17ac19721
    secrets:
      GIST_SECRET: ${{ secrets.GIST_SECRET }}
