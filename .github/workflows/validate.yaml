name: Validate

"on":
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Daily at midnight

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Branch @main — update SHA after pushing .github changes v2.0.5
    uses: PlayFaster/.github/.github/workflows/validate.yaml@00f1aed621398239f2258d739f2b8428cfd4cd96
    with:
      category: integration
      component_name: huawei_router_5g
      gist_id: b5cb47f2b37e140da07eefd17ac19721
    secrets:
      GIST_SECRET: ${{ secrets.GIST_SECRET }}
